# Alongside — local development stack (five services)
#
#   web      Django dev server            http://localhost:8000
#   postgres PostgreSQL 16                localhost:5432
#   redis    Redis 7                      localhost:6379
#   worker   Celery worker
#   beat     Celery beat (scheduler)
#
# First run:
#   cp .env.example .env
#   docker compose up --build
#
# Production runs a deliberately different shape — see docs/deployment.md §4.
# The point of this file is that the *real* Celery topology exists somewhere,
# and that somewhere is your laptop.

name: alongside

x-django: &django
  build:
    context: .
    target: dev
  image: alongside-dev:latest
  env_file: .env
  volumes:
    - .:/app
    - static_files:/app/staticfiles
    - media_files:/app/media
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  # ── Application ──────────────────────────────────────────────
  web:
    <<: *django
    # Invoked via `bash` on purpose. The bind mount below replaces /app wholesale,
    # which also masks the `chmod +x` the Dockerfile applies — so in dev the exec
    # bit comes from however Docker Desktop maps a Windows/OneDrive path, not from
    # the image or the git index. Calling the interpreter directly removes that
    # dependency entirely. (Prod has no bind mount, so start-web.sh runs directly.)
    command: bash /app/scripts/start-dev.sh
    ports:
      - "8000:8000"
    stdin_open: true          # so `import pdb; pdb.set_trace()` is usable
    tty: true

  # ── Data ─────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-alongside}
      POSTGRES_USER: ${POSTGRES_USER:-alongside}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alongside}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"           # so a GUI client can connect from Windows
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-alongside} -d ${POSTGRES_DB:-alongside}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── Background work ──────────────────────────────────────────
  worker:
    <<: *django
    command: celery -A config worker --loglevel=info --concurrency=2
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  beat:
    <<: *django
    # The schedule file goes outside the bind mount — writing it into /app would
    # drop a binary artefact into the repo (and into OneDrive) on every run.
    command: celery -A config beat --loglevel=info --schedule=/tmp/celerybeat-schedule

volumes:
  postgres_data:
  redis_data:
  static_files:
  media_files:
